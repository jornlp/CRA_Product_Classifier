<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRA Scope &amp; Classifier</title>
  <meta name="description" content="Informational check of Cyber Resilience Act scope and product class. Not legal advice.">
  <style>
    :root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #5d5b55; --line: #dedad2; --warn-bg: #fff4d6; --warn: #7a5200; }
    @media (prefers-color-scheme: dark) { :root { --bg: #171715; --fg: #ecebe6; --muted: #a8a59c; --line: #34332f; --warn-bg: #3a2f12; --warn: #f2c96b; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, sans-serif; }
    main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    .muted { color: var(--muted); }
    .box { border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; margin: 1.2rem 0; }
    .warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>CRA Scope &amp; Classifier</h1>
    <p class="muted">Pilot in development. Informational only; not legal advice.</p>
    <div id="app" aria-live="polite"></div>
    <noscript>This tool runs in your browser and needs JavaScript. Nothing you enter leaves this page.</noscript>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
