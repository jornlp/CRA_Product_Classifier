# Every push and pull request: the engine must still match the reference outputs, the schemas must
# still reject broken documents, and every rule quote must still be verbatim in the held sources.
name: ci
on:
  push:
  pull_request:
  workflow_call:   # pages.yml runs these same checks before every deploy
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Type check and tests (golden fixtures, schemas)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify rules against held sources (quotes, category list, open-question references)
        run: npm run verify:research
      - name: Golden fixtures are up to date with the Python reference engine
        run: |
          (cd docs/research/wp7-spike && python3 export_fixtures.py)
          git diff --exit-code tests/fixtures || { echo "tests/fixtures is stale: run export_fixtures.py and commit" >&2; exit 1; }
      - name: Question texts match the fact register
        run: python3 docs/research/tools/build_questions.py --check
      - name: Build the site
        run: npm run build -w @cra/web
      - name: No external requests in the built site (AC-07)
        run: |
          # Allowed: the link to this repository (for reporting errors), a link the user may click; and the
          # GoatCounter endpoint, which receives only page and event names (analytics.ts), never answers.
          # Anything else fails the build.
          found=$(grep -rhEo 'https?://[^"'"'"' )`]+' apps/web/dist --include='*.js' --include='*.html' | grep -vE '^https://(github\.com/jornlp/CRA_Product_Classifier|[a-z0-9-]+\.goatcounter\.com/count)$' || true)
          if [ -n "$found" ]; then
            echo "The built site references an external URL. Assessment data must never leave the browser:" >&2
            echo "$found" >&2
            exit 1
          fi
